name: Build release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unique release tag (application version stays unchanged)
        required: true
        type: string
      publish:
        description: Publish after all checks (otherwise draft)
        default: false
        type: boolean
      prerelease:
        description: Mark this release as a pre-release instead of stable
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: python3 scripts/verify-publication.py
      - name: Validate tag
        run: python3 -c 'import os,re; assert re.fullmatch(r"v[0-9][A-Za-z0-9._-]{0,99}",os.environ["RELEASE_TAG"]), "Invalid release tag"'
      - run: cargo +stable test --locked --tests
      - run: |
          node tests/browser/mheard-routes.cjs
          node tests/browser/notification-audio.cjs
          node tests/browser/notification-sounds.cjs
          node tests/browser/product-identity.cjs
          node tests/browser/settings-variants.cjs
          bash tests/installers/bootstrap.sh
          python3 tests/packaging/product-boundary.py
          python3 tests/packaging/release-download.py
          python3 tests/packaging/desktop-release.py
          python3 tests/packaging/installer-hooks.py

  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: windows-2022
            platform: windows-i686
            target: i686-pc-windows-msvc
          - os: ubuntu-22.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            platform: macos-universal
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - if: matrix.target != 'universal-apple-darwin'
        run: rustup target add ${{ matrix.target }}
      - if: matrix.target == 'universal-apple-darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      # Official prebuilt CLI avoids rebuilding the release tool on every runner.
      - run: npm exec --yes --package=@tauri-apps/cli@2.11.5 -- tauri --version
      - run: cargo fetch --locked --manifest-path desktop/Cargo.toml
      - run: python scripts/desktop-licenses.py
      - run: python -c "from pathlib import Path; assert not Path('desktop/target/legal/MISSING-LICENSE-TEXTS.txt').exists()"
      - run: cargo test --locked --manifest-path desktop/Cargo.toml
      - if: startsWith(matrix.platform, 'windows-')
        working-directory: desktop
        run: npm exec --yes --package=@tauri-apps/cli@2.11.5 -- tauri build --target ${{ matrix.target }} --bundles nsis --no-sign -- --locked
      - if: matrix.platform == 'linux-x86_64'
        working-directory: desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm exec --yes --package=@tauri-apps/cli@2.11.5 -- tauri build --target ${{ matrix.target }} --bundles deb,appimage -- --locked
      - if: matrix.platform == 'macos-universal'
        working-directory: desktop
        run: npm exec --yes --package=@tauri-apps/cli@2.11.5 -- tauri build --target universal-apple-darwin --bundles dmg --no-sign -- --locked
      - name: Test Windows installation and legacy migration
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if (@($installer).Count -ne 1) { throw 'Expected one installer' }
          ./tests/installers/windows-installer.ps1 -Installer $installer.FullName
      - name: Collect platform installer
        shell: bash
        run: python scripts/collect-desktop-release.py "${{ matrix.platform }}" "$RELEASE_TAG" target/release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.platform }}
          path: target/release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [checks, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: target/release-assets
          merge-multiple: true
      - run: python3 scripts/emit-installer.py --bootstrap target/release-assets/install.sh
      - run: python3 scripts/finalize-release.py "$RELEASE_TAG" target/release-assets
      - name: Create complete release (retry transient GitHub API errors)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/create-release.py \
            "$RELEASE_TAG" \
            "${{ github.repository }}" \
            "${{ github.sha }}" \
            "${{ inputs.prerelease }}" \
            "${{ inputs.publish }}" \
            target/release-assets
