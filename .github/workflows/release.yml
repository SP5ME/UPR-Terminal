name: Build release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unique release tag (application version stays unchanged)
        required: true
        type: string
      publish:
        description: Publish as pre-release after all checks (otherwise draft)
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: python3 scripts/verify-publication.py
      - name: Validate tag
        run: python3 -c 'import os,re; assert re.fullmatch(r"v[0-9][A-Za-z0-9._-]{0,99}",os.environ["RELEASE_TAG"]), "Invalid release tag"'
      - run: cargo +stable test --locked --tests
      - run: |
          node tests/browser/mheard-routes.cjs
          node tests/browser/notification-audio.cjs
          node tests/browser/notification-sounds.cjs
          node tests/browser/product-identity.cjs
          node tests/browser/settings-variants.cjs
          bash tests/installers/bootstrap.sh
          python3 tests/packaging/product-boundary.py
          python3 tests/packaging/release-download.py
          python3 tests/packaging/desktop-release.py
          python3 tests/packaging/installer-hooks.py

  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      # Official prebuilt CLI avoids rebuilding the release tool on every runner.
      - run: npm exec --yes --package=@tauri-apps/cli@2.11.5 -- tauri --version
      - run: cargo fetch --locked --manifest-path desktop/Cargo.toml
      - run: python scripts/desktop-licenses.py
      - run: python -c "from pathlib import Path; assert not Path('desktop/target/legal/MISSING-LICENSE-TEXTS.txt').exists()"
      - run: cargo test --locked --manifest-path desktop/Cargo.toml
      - if: runner.os == 'Windows'
        working-directory: desktop
        run: npm exec --yes --package=@tauri-apps/cli@2.11.5 -- tauri build --bundles nsis --no-sign -- --locked
      - if: runner.os == 'Linux'
        working-directory: desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm exec --yes --package=@tauri-apps/cli@2.11.5 -- tauri build --bundles deb,appimage -- --locked
      - name: Test Windows installation and legacy migration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/target/release/bundle/nsis/*-setup.exe
          if (@($installer).Count -ne 1) { throw 'Expected one installer' }
          ./tests/installers/windows-installer.ps1 -Installer $installer.FullName
      - name: Collect desktop installer
        shell: bash
        run: python scripts/collect-desktop-release.py "$RUNNER_OS" "$RELEASE_TAG" target/release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ runner.os }}
          path: target/release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [checks, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: target/release-assets
          merge-multiple: true
      - run: python3 scripts/emit-installer.py --bootstrap target/release-assets/install.sh
      - run: python3 scripts/finalize-release.py "$RELEASE_TAG" target/release-assets
      - name: Upload complete release (never replace an existing tag)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then echo 'Release already exists; refusing overwrite'; exit 1; fi
          gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --target "$COMMIT" --draft --prerelease --title "UPR Terminal $RELEASE_TAG" --notes-file target/release-assets/RELEASE-NOTES.md target/release-assets/*
          if [ "$PUBLISH" = true ]; then gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false; fi
