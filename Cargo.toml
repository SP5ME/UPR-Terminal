[package]
autobins = false
name = "ultimatepr-station"
version = "0.1.3-prealpha.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
exclude = [".local-notes/**"]

[lib]
name = "ultimatepr"

[dependencies]
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Devices_Communication", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[profile.release]
opt-level = "s"
lto = true
strip = true

